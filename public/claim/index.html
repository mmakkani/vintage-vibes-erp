<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vintage Vibes Dubai — VIP Live Claim Desk</title>
  <style>
    body { background: #090d16; color: #f8fafc; font-family: Arial, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
    .card { background: #0f172a; border: 2px solid #f59e0b; border-radius: 20px; padding: 32px 28px; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
    h1 { color: #fde68a; font-size: 22px; margin: 0 0 12px; }
    p { color: #cbd5e1; font-size: 15px; line-height: 1.5; margin-bottom: 24px; }
    a.btn { display: inline-block; background: linear-gradient(90deg, #f59e0b, #fbbf24); color: #090d16; font-weight: 900; text-decoration: none; padding: 14px 26px; border-radius: 12px; font-size: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>VINTAGE VIBES DUBAI</h1>
    <p>Connecting you to our VIP Order Concierge to lock your 1-of-1 piece...</p>
    <a id="claimBtn" class="btn" href="https://wa.me/971554186086?text=Assalam%20Alaikum%20Vintage%20Vibes!%20I%20want%20to%20CLAIM%20my%20Live%20Stream%20item!">Tap Here if Not Redirected</a>
  </div>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var sku = params.get('sku') || '';
      var msg = sku
        ? 'Assalam Alaikum Vintage Vibes! I want to CLAIM Live Item #' + sku
        : 'Assalam Alaikum Vintage Vibes! I came from Live Stream to claim my item!';
      var target = 'https://wa.me/971554186086?text=' + encodeURIComponent(msg);
      document.getElementById('claimBtn').href = target;
      setTimeout(function() { window.location.replace(target); }, 300);
    })();
  </script>
</body>
</html>
