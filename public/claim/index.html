<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vintage Vibes UAE — Official Live Claim Desk</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: radial-gradient(circle at top, #1c1610 0%, #090d16 70%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #f59e0b;
      border-radius: 24px;
      padding: 28px 22px;
      width: 100%;
      max-width: 410px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
    }
    .seal {
      display: inline-block;
      background: rgba(16, 185, 129, 0.18);
      border: 1px solid #34d399;
      color: #6ee7b7;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
      text-transform: uppercase;
    }
    h1 {
      color: #fde68a;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
      margin: 0 0 8px;
    }
    p {
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 22px;
    }
    .btn-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    a.btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 800;
      text-decoration: none;
      padding: 15px 20px;
      border-radius: 14px;
      font-size: 15px;
      transition: transform 0.15s ease;
    }
    a.btn:active {
      transform: scale(0.98);
    }
    a.btn-wa {
      background: linear-gradient(90deg, #10b981, #059669);
      color: #ffffff;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.35);
    }
    a.btn-w4b {
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
      color: #090d16;
      box-shadow: 0 8px 24px rgba(245, 158, 11, 0.3);
    }
    a.btn-web {
      background: #1e293b;
      border: 1px solid #475569;
      color: #e2e8f0;
      font-size: 13px;
      padding: 12px 16px;
    }
    .footer {
      margin-top: 18px;
      font-size: 11px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="seal">♻️ Pre-Loved Thrift • UAE License CN-5888545</div>
    <h1>VINTAGE VIBES UAE</h1>
    <p>Opening your mobile WhatsApp app to claim your 1-of-1 Pre-Loved Thrift piece...</p>
    <div class="btn-stack">
      <a id="nativeWaBtn" class="btn btn-wa" href="#">📲 Open in WhatsApp App</a>
      <a id="businessWaBtn" class="btn btn-w4b" href="#">💼 Open in WhatsApp Business</a>
      <a id="fallbackWaBtn" class="btn btn-web" href="#">🌐 Universal WhatsApp Link</a>
    </div>
    <div class="footer">Vintage Vibes General Trading LLC SPC • Al Ain &amp; Dubai, UAE</div>
  </div>
  <script>
    (function() {
      // Unregister any old ERP service worker so /claim never opens the web app
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        }).catch(function(){});
      }

      var params = new URLSearchParams(window.location.search);
      var sku = params.get('sku') || '';
      var msg = sku
        ? 'Assalam Alaikum Vintage Vibes! I want to CLAIM Pre-Loved Live Item #' + sku
        : 'Assalam Alaikum Vintage Vibes! I came from TikTok Live to claim my Pre-Loved item!';
      var encMsg = encodeURIComponent(msg);
      var phone = '971554186086';

      // 1. Native Mobile Deep Link (opens WhatsApp or WhatsApp Business directly on iOS & Android)
      var nativeUrl = 'whatsapp://send?phone=' + phone + '&text=' + encMsg;

      // 2. Explicit Android Intent for WhatsApp Business (com.whatsapp.w4b) with fallback to native whatsapp://
      var isAndroid = /Android/i.test(navigator.userAgent || '');
      var w4bUrl = isAndroid
        ? 'intent://send/?phone=' + phone + '&text=' + encMsg + '#Intent;scheme=whatsapp;package=com.whatsapp.w4b;S.browser_fallback_url=' + encodeURIComponent('whatsapp://send?phone=' + phone + '&text=' + encMsg) + ';end'
        : nativeUrl;

      // 3. Universal API link
      var apiUrl = 'https://api.whatsapp.com/send?phone=' + phone + '&text=' + encMsg;

      document.getElementById('nativeWaBtn').href = nativeUrl;
      document.getElementById('businessWaBtn').href = w4bUrl;
      document.getElementById('fallbackWaBtn').href = apiUrl;

      // Automatically trigger native mobile WhatsApp app immediately!
      var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '');
      if (isMobile) {
        window.location.href = nativeUrl;
        setTimeout(function() {
          // If still visible in TikTok in-app browser after 1.2s, try api.whatsapp.com
          if (!document.hidden) {
            window.location.href = apiUrl;
          }
        }, 1200);
      } else {
        setTimeout(function() {
          window.location.replace(apiUrl);
        }, 500);
      }
    })();
  </script>
</body>
</html>
