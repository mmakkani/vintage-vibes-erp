<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=720,height=1280,initial-scale=1" />
  <title>Vintage Vibes 9:16 Clean Broadcast Feed</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw; height: 100vh; overflow: hidden;
      background: #070709;
      display: flex; align-items: center; justify-content: center;
    }
    video, canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      background: #070709;
    }
    canvas { z-index: 5; pointer-events: none; }
  </style>
</head>
<body>
  <video id="v" autoplay muted playsinline></video>
  <canvas id="c" width="720" height="1280"></canvas>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var booth = params.get('booth') || 'booth-1';
      var wantAudio = params.get('audio') === '1';
      var hlsUrl = '/api/live/hls/' + encodeURIComponent(booth) + '/index.m3u8';
      var v = document.getElementById('v');
      var c = document.getElementById('c');
      var ctx = c.getContext('2d', { alpha: false });
      setInterval(function () {
        if (ctx && v && v.readyState >= 2 && v.videoWidth) {
          try { ctx.drawImage(v, 0, 0, c.width, c.height); } catch (_) {}
        }
      }, 40);
      var hls = null;
      var attached = false;
      var lastCt = -1;
      var stallTicks = 0;

      function teardown() {
        attached = false;
        if (hls) {
          try { hls.destroy(); } catch (_) {}
          hls = null;
        }
      }

      async function ensurePlaying() {
        if (attached) return;
        try {
          var r = await fetch(hlsUrl + '?t=' + Date.now(), { cache: 'no-store' });
          if (!r.ok) return;
          var txt = await r.text();
          if (!txt || txt.indexOf('#EXTM3U') === -1) return;
          attached = true;
          v.muted = !wantAudio;
          v.volume = 1.0;
          if (window.Hls && window.Hls.isSupported()) {
            hls = new window.Hls({
              lowLatencyMode: false,
              liveSyncDurationCount: 3,
              liveMaxLatencyDurationCount: 7,
              maxBufferLength: 20,
              backBufferLength: 8
            });
            hls.on(window.Hls.Events.MANIFEST_PARSED, function () {
              v.muted = !wantAudio;
              v.volume = 1.0;
              v.play().catch(function () {
                v.muted = true;
                v.play().catch(function () {});
              });
            });
            hls.on(window.Hls.Events.ERROR, function (_e, d) {
              if (d && d.fatal) {
                if (d.type === window.Hls.ErrorTypes.MEDIA_ERROR) {
                  try { hls.recoverMediaError(); return; } catch (_) {}
                }
                teardown();
              }
            });
            hls.loadSource(hlsUrl);
            hls.attachMedia(v);
          } else {
            v.src = hlsUrl + '?v=' + Date.now();
            v.play().catch(function () {});
          }
        } catch (_) {
          attached = false;
        }
      }

      ensurePlaying();
      setInterval(function () {
        if (!attached) {
          ensurePlaying();
          return;
        }
        if (v.paused) v.play().catch(function () {});
        var ct = Number(v.currentTime || 0);
        if (lastCt >= 0 && Math.abs(ct - lastCt) < 0.03) {
          stallTicks++;
          if (stallTicks >= 4) {
            stallTicks = 0;
            lastCt = -1;
            teardown();
            ensurePlaying();
          }
        } else {
          stallTicks = 0;
        }
        lastCt = ct;
      }, 2000);
    })();
  </script>
</body>
</html>
