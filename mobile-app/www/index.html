<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>VV Connect</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #0b141a; color: #e9edef;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      width: min(90vw, 360px); background: #111b21; border: 1px solid rgba(245, 196, 81, 0.35);
      border-radius: 18px; padding: 24px; text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    }
    .badge {
      width: 68px; height: 68px; margin: 0 auto 14px; border-radius: 18px;
      background: linear-gradient(135deg, #fde68a, #d97706); color: #0b141a;
      display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 900;
    }
    h1 { font-size: 18px; margin: 0 0 8px; color: #fde68a; }
    p { font-size: 13px; color: #8696a0; line-height: 1.5; margin: 0 0 16px; }
    button {
      width: 100%; padding: 12px 16px; border: none; border-radius: 12px;
      background: #00a884; color: #052e16; font-size: 14px; font-weight: 800; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">VV</div>
    <h1>Vintage Vibes Connect</h1>
    <p>Internet connection check ho raha hai — live VV Connect server se connect kar rahe hain.</p>
    <button type="button" onclick="retryConnect()">Connect Now</button>
  </div>
  <script>
    function retryConnect() {
      location.replace('https://vintagevibesgk.com/live/connect?nativeApp=1');
    }
    setTimeout(retryConnect, 1200);
  </script>
</body>
</html>
