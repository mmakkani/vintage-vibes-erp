<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07080c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vintage Vibes" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/logo192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/logo512.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/vintage_logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet" />
    <title>Vintage Vibe — Enterprise Apparel ERP</title>
    <meta name="description" content="Enterprise-grade ERP system for vintage & used clothing bale processing, dual-entry COA finance, pieces breakdown with AI OCR, inventory, and sales workflows." />
    <meta property="og:title" content="Vintage Vibe — Enterprise Apparel ERP" />
    <meta property="og:description" content="Enterprise-grade ERP system for vintage & used clothing bale processing, dual-entry COA finance, pieces breakdown with AI OCR, inventory, and sales workflows." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Early PWA Install Prompt Capture for Android & Desktop Chromium
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPWAInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa_prompt_ready', { detail: e }));
      });

      // Outdated deployment chunk & MIME mismatch auto-recovery
      (function() {
        function triggerHardRefresh() {
          var lastReload = sessionStorage.getItem('vv_last_chunk_reload');
          var now = Date.now();
          if (!lastReload || now - parseInt(lastReload, 10) > 8000) {
            sessionStorage.setItem('vv_last_chunk_reload', String(now));
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            }
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
              });
            }
            window.location.reload();
          }
        }

        window.addEventListener('vite:preloadError', function(e) {
          console.warn('[Vite Preload Error] Outdated chunk detected, refreshing...', e);
          triggerHardRefresh();
        });

        window.addEventListener('error', function(e) {
          var msg = (e && e.message) ? e.message : '';
          if (
            msg.indexOf('Failed to load module script') !== -1 ||
            msg.indexOf('Expected a JavaScript-or-wasm module script') !== -1 ||
            msg.indexOf('error loading dynamically imported module') !== -1
          ) {
            console.warn('[MIME/Module Error] Script mismatch detected, auto-reloading...', msg);
            triggerHardRefresh();
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-[#07080c]">
    <div id="root">
      <div style="min-height: 100vh; background-color: #07080c; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; position: relative; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <!-- Radial Gold Ambient Glow -->
        <div style="position: absolute; inset: 0; background: radial-gradient(circle at center, rgba(217, 119, 6, 0.22) 0%, transparent 65%); pointer-events: none;"></div>

        <!-- Central 3D Gold Seal with Specular Sweep -->
        <div style="position: relative; width: 170px; height: 170px; display: flex; align-items: center; justify-content: center; animation: vv-init-zoom 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; filter: drop-shadow(0 0 35px rgba(245, 158, 11, 0.65));">
          <img src="/vintage_vibes_seal.svg" alt="Vintage Vibes Seal" style="width: 100%; height: 100%; object-fit: contain;" />
          <div style="position: absolute; inset: 0; border-radius: 50%; overflow: hidden; pointer-events: none;">
            <div style="width: 100%; height: 100%; background: linear-gradient(to right, transparent, rgba(254, 243, 199, 0.65), transparent); animation: vv-init-shimmer 2.2s ease-in-out infinite;"></div>
          </div>
        </div>

        <h1 style="margin-top: 24px; font-weight: 900; font-size: 18px; letter-spacing: 5px; text-transform: uppercase; color: #fde68a; font-family: 'Cinzel', serif; animation: vv-init-fade 1s ease-out 0.3s both;">
          VINTAGE VIBES
        </h1>
        <div style="width: 70px; height: 1px; background: linear-gradient(to right, transparent, #f59e0b, transparent); margin: 8px auto 6px auto;"></div>
        <p style="font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #fcd34d; font-family: 'Cinzel', serif; opacity: 0.8; animation: vv-init-fade 1s ease-out 0.6s both;">
          HAUTE ARCHIVE • DUBAI
        </p>

        <!-- Laser Progress Bar -->
        <div style="margin-top: 28px; width: 130px; height: 2px; background: #1c1917; border-radius: 9999px; overflow: hidden; position: relative;">
          <div style="width: 100%; height: 100%; background: linear-gradient(to right, #d97706, #fde68a, #d97706); border-radius: 9999px; animation: vv-init-laser 1.8s ease-in-out infinite;"></div>
        </div>

        <button id="vv-reload-btn" onclick="if(window.caches){caches.keys().then(function(k){k.forEach(function(c){caches.delete(c);});});}if(navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(s){s.unregister();});});}window.location.reload();" style="display:none; margin-top: 20px; padding: 7px 16px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; background: #d97706; color: #07080c; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 12px rgba(217,119,6,0.4);">Update & Refresh ↻</button>
      </div>
      <style>
        @keyframes vv-init-zoom {
          0% { transform: scale(0.65); opacity: 0; }
          40% { transform: scale(1.04); opacity: 1; }
          100% { transform: scale(1); opacity: 1; }
        }
        @keyframes vv-init-shimmer {
          0% { transform: translateX(-150%) translateY(-150%) rotate(45deg); }
          100% { transform: translateX(250%) translateY(250%) rotate(45deg); }
        }
        @keyframes vv-init-fade {
          0% { opacity: 0; transform: translateY(8px); }
          100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes vv-init-laser {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(100%); }
        }
      </style>
      <script>
        setTimeout(function() {
          var b = document.getElementById('vv-reload-btn');
          if (b) b.style.display = 'inline-block';
        }, 4500);
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
