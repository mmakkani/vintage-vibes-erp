  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vintage Vibes" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/logo192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/logo512.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/vintage_logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet" />
    <title>Vintage Vibe — Enterprise Apparel ERP</title>
    <meta name="description" content="Enterprise-grade ERP system for vintage & used clothing bale processing, dual-entry COA finance, pieces breakdown with AI OCR, inventory, and sales workflows." />
    <meta property="og:title" content="Vintage Vibe — Enterprise Apparel ERP" />
    <meta property="og:description" content="Enterprise-grade ERP system for vintage & used clothing bale processing, dual-entry COA finance, pieces breakdown with AI OCR, inventory, and sales workflows." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Outdated deployment chunk & MIME mismatch auto-recovery
      (function() {
        function triggerHardRefresh() {
          var lastReload = sessionStorage.getItem('vv_last_chunk_reload');
          var now = Date.now();
          if (!lastReload || now - parseInt(lastReload, 10) > 8000) {
            sessionStorage.setItem('vv_last_chunk_reload', String(now));
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            }
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
              });
            }
            window.location.reload();
          }
        }

        window.addEventListener('vite:preloadError', function(e) {
          console.warn('[Vite Preload Error] Outdated chunk detected, refreshing...', e);
          triggerHardRefresh();
        });

        window.addEventListener('error', function(e) {
          var msg = (e && e.message) ? e.message : '';
          if (
            msg.indexOf('Failed to load module script') !== -1 ||
            msg.indexOf('Expected a JavaScript-or-wasm module script') !== -1 ||
            msg.indexOf('error loading dynamically imported module') !== -1
          ) {
            console.warn('[MIME/Module Error] Script mismatch detected, auto-reloading...', msg);
            triggerHardRefresh();
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-[#FAF4E6]">
    <div id="root">
      <div style="min-height: 100vh; background-color: #FAF4E6; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 20px;">
        <div style="width: 56px; height: 56px; border: 4px solid #F59E0B; border-top-color: transparent; border-radius: 50%; animation: vv-spin 0.8s linear infinite;"></div>
        <h2 style="margin-top: 20px; font-weight: 900; font-size: 16px; letter-spacing: 2px; text-transform: uppercase; color: #78350F; font-family: 'Cinzel', serif;">Vintage Vibes LLC SPC</h2>
        <p style="margin-top: 6px; font-size: 12px; font-weight: 600; color: #92400E; max-width: 280px;">Loading Live Boutique Storefront & Rare 1-of-1 Pieces...</p>
        <button id="vv-reload-btn" onclick="if(window.caches){caches.keys().then(function(k){k.forEach(function(c){caches.delete(c);});});}if(navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(s){s.unregister();});});}window.location.reload();" style="display:none; margin-top: 14px; padding: 6px 14px; font-size: 11px; font-weight: bold; background: #78350F; color: #FAF4E6; border: none; border-radius: 6px; cursor: pointer;">Update & Refresh App ↻</button>
      </div>
      <style>
        @keyframes vv-spin { to { transform: rotate(360deg); } }
      </style>
      <script>
        setTimeout(function() {
          var b = document.getElementById('vv-reload-btn');
          if (b) b.style.display = 'inline-block';
        }, 3500);
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
