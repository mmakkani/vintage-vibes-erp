    <script>
      // Early Extension Crash Isolation Shield (suppresses third-party Chrome extension crashes: content.js, useCache, closed messaging ports)
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = String((reason && reason.message) || reason || '');
        var stack = String((reason && reason.stack) || '');
        if (
          msg.indexOf('useCache') !== -1 ||
          msg.indexOf('rytr') !== -1 ||
          msg.indexOf('Could not establish connection') !== -1 ||
          msg.indexOf('Receiving end does not exist') !== -1 ||
          stack.indexOf('content.js') !== -1 ||
          stack.indexOf('chrome-extension://') !== -1 ||
          stack.indexOf('moz-extension://') !== -1
        ) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      });

      window.addEventListener('error', function(event) {
        var msg = String((event && event.message) || '');
        var filename = String((event && event.filename) || '');
        if (
          msg.indexOf('useCache') !== -1 ||
          msg.indexOf('Could not establish connection') !== -1 ||
          msg.indexOf('Receiving end does not exist') !== -1 ||
          filename.indexOf('content.js') !== -1 ||
          filename.indexOf('chrome-extension://') !== -1
        ) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      }, true);

      // Early PWA Install Prompt Capture for Android & Desktop Chromium
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__deferredPWAInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa_prompt_ready', { detail: e }));
      });

      // Outdated deployment chunk & MIME mismatch auto-recovery
      (function() {
        function triggerHardRefresh() {
          var lastReload = sessionStorage.getItem('vv_last_chunk_reload');
          var now = Date.now();
          if (!lastReload || now - parseInt(lastReload, 10) > 8000) {
            sessionStorage.setItem('vv_last_chunk_reload', String(now));
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            }
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(r) { r.unregister(); });
              });
            }
            window.location.reload();
          }
        }

        window.addEventListener('vite:preloadError', function(e) {
          console.warn('[Vite Preload Error] Outdated chunk detected, refreshing...', e);
          triggerHardRefresh();
        });

        window.addEventListener('error', function(e) {
          var msg = (e && e.message) ? e.message : '';
          if (
            msg.indexOf('Failed to load module script') !== -1 ||
            msg.indexOf('Expected a JavaScript-or-wasm module script') !== -1 ||
            msg.indexOf('error loading dynamically imported module') !== -1
          ) {
            console.warn('[MIME/Module Error] Script mismatch detected, auto-reloading...', msg);
            triggerHardRefresh();
          }
        }, true);
      })();
    </script>
